# Overrides for the Playwright run: small seed, shared test clock, stub controls.
#   docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build
services:
  migrate:
    environment:
      SEED_PROFILE: small
  api-a:
    environment:
      TEST_CLOCK_ENABLED: 'true'
      # the browser journeys log in a lot from one address; the limiter must not get in their way
      RATE_LIMIT_LOGIN_PER_IP: 1000
      RATE_LIMIT_LOGIN_PER_ACCOUNT: 1000
  api-b:
    environment:
      TEST_CLOCK_ENABLED: 'true'
      # the browser journeys log in a lot from one address; the limiter must not get in their way
      RATE_LIMIT_LOGIN_PER_IP: 1000
      RATE_LIMIT_LOGIN_PER_ACCOUNT: 1000
  worker:
    environment:
      TEST_CLOCK_ENABLED: 'true'
      RECONCILE_INTERVAL_MS: 500
  shop-stub:
    environment:
      SHOP_STUB_CONTROL_ENABLED: 'true'
