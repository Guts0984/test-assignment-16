name: fulfillment

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.116.0/24

volumes:
  pgdata: {}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ['postgres', '-c', 'max_connections=400', '-c', 'shared_buffers=256MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
