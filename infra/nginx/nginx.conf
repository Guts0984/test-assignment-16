# Two api copies behind nginx. nginx is the only trusted proxy: it overwrites the client-IP
# headers with the address it actually saw, so a client cannot spoof them.
worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;          # larger bodies get 413 (the api limits too)
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream api {
    server api-a:3000 max_fails=3 fail_timeout=5s;
    server api-b:3000 max_fails=3 fail_timeout=5s;
    keepalive 64;
  }
  upstream web { server web:3001; }

  server {
    listen 80;
    limit_conn perip 1000;      # acceptance #3 sends 300 simultaneous orders from one address

    # Client address: always what nginx saw, never what the client claims.
    set $real_ip $remote_addr;
    proxy_set_header X-Real-IP $real_ip;
    proxy_set_header X-Forwarded-For $real_ip;
    proxy_set_header Forwarded "";
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Errors generated by nginx itself use the same JSON error body as the api.
    limit_conn_status 429;
    error_page 400 = @err400;
    error_page 413 = @err413;
    # A request line that did not parse has no URI yet, so nginx cannot use a named location for it.
    error_page 414 /_err414;
    error_page 431 494 = @err431;
    error_page 429 = @err429;
    error_page 502 503 504 = @err5xx;
    location @err400 { internal; default_type application/json; return 400 '{"error":{"code":"VALIDATION_FAILED","message":"bad request","requestId":"nginx"}}'; }
    location = /_err414 { internal; default_type application/json; return 414 '{"error":{"code":"VALIDATION_FAILED","message":"request address too long","requestId":"nginx"}}'; }
    location @err431 { internal; default_type application/json; return 431 '{"error":{"code":"VALIDATION_FAILED","message":"request headers too large","requestId":"nginx"}}'; }
    location @err413 { internal; default_type application/json; return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"request body too large","requestId":"nginx"}}'; }
    location @err429 { internal; default_type application/json; return 429 '{"error":{"code":"RATE_LIMITED","message":"too many connections","requestId":"nginx"}}'; }
    location @err5xx { internal; default_type application/json; return 503 '{"error":{"code":"UNEXPECTED","message":"service temporarily unavailable","requestId":"nginx"}}'; }

    location /api/ {
      proxy_pass http://api;
      proxy_read_timeout 60s;
    }
    location /docs {
      proxy_pass http://api;
    }
    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location / {
      proxy_pass http://web;
    }
  }
}
