name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build
      - name: OpenAPI document and generated web client match the code
        run: |
          pnpm --filter @ff/api openapi:export
          pnpm --filter @ff/web api:generate
          git diff --exit-code -- apps/api/openapi.json apps/web/src/shared/api/generated
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: integration (real postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fulfillment
          POSTGRES_PASSWORD: change-me-postgres
          POSTGRES_DB: fulfillment
        ports: ['25432:5432']
        options: >-
          --health-cmd "pg_isready -U fulfillment" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ['26379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build
      - name: OpenAPI document matches the code
        run: pnpm --filter @ff/api openapi:export && git diff --exit-code -- apps/api/openapi.json
      - run: pnpm test:int

  adversarial:
    name: adversarial suite (real nginx, two api copies, three workers)
    runs-on: ubuntu-latest
    needs: [checks]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fulfillment, POSTGRES_PASSWORD: change-me-postgres, POSTGRES_DB: fulfillment }
        ports: ['25432:5432']
        options: >-
          --health-cmd "pg_isready -U fulfillment" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm --filter @ff/api test:adversarial

  e2e:
    name: playwright journeys on the full compose stack (small seed)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build --wait
      - run: pnpm smoke
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs --tail 100

  perf-full-seed:
    name: performance budgets on the full seed
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - name: full seed volumes
        run: docker compose exec -T postgres psql -U fulfillment -d fulfillment -v ON_ERROR_STOP=1 < scripts/seed-full-check.sql
      - run: pnpm smoke
      - run: pnpm perf
